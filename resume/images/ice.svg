<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="460" viewBox="0 0 520 460" fill="none">

  <!-- 背景（浅色冰冷感） -->
  <rect width="520" height="460" fill="#E0F7FA"/>

  <!-- 等距立方体 - 冰块结构 -->
  
  <!-- 正面（Front） -->
  <polygon points="160,240 360,240 360,440 160,440" fill="#81E8E8" stroke="#1E88E5" stroke-width="12" opacity="0.95"/>
  
  <!-- 右侧面（Right） -->
  <polygon points="360,240 440,190 440,390 360,440" fill="#7CD4D8" stroke="#1E88E5" stroke-width="12" opacity="0.95"/>
  
  <!-- 顶面（Top） -->
  <polygon points="160,240 360,240 440,190 240,190" fill="#A5F2F3" stroke="#1E88E5" stroke-width="12" opacity="0.95"/>

  <!-- 冰块高光与裂纹效果 -->
  <!-- 正面高光 -->
  <polygon points="170,250 260,250 260,310 170,350" fill="#FFFFFF" opacity="0.25"/>
  <!-- 右侧高光 -->
  <polygon points="370,250 425,225 425,300 370,340" fill="#FFFFFF" opacity="0.2"/>
  <!-- 顶面高光 -->
  <polygon points="180,230 300,210 370,195 240,195" fill="#FFFFFF" opacity="0.3"/>
  
  <!-- 轻微冰裂纹 -->
  <path d="M190 300 L250 265 M280 330 L310 280" stroke="#E0F2F1" stroke-width="3" opacity="0.6"/>
  <path d="M380 270 L415 310" stroke="#E0F2F1" stroke-width="2" opacity="0.5"/>

  <!-- 表情定义（可复用） -->
  <defs>
    <!-- 表情1：开心笑脸 (正面) -->
    <g id="happy">
      <!-- 脸 -->
      <circle cx="0" cy="0" r="48" fill="#FFF9C4" stroke="#263238" stroke-width="6"/>
      <!-- 眼睛 -->
      <circle cx="-17" cy="-12" r="7" fill="#263238"/>
      <circle cx="17" cy="-12" r="7" fill="#263238"/>
      <!-- 微笑嘴巴 -->
      <path d="M-22,15 Q0,32 22,15" fill="none" stroke="#263238" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- 表情2：惊讶 (右侧) -->
    <g id="surprise">
      <!-- 脸 -->
      <circle cx="0" cy="0" r="38" fill="#FFF9C4" stroke="#263238" stroke-width="5"/>
      <!-- 眼睛 -->
      <circle cx="-12" cy="-10" r="6" fill="#263238"/>
      <circle cx="12" cy="-10" r="6" fill="#263238"/>
      <!-- 惊讶嘴巴 -->
      <circle cx="0" cy="14" r="8" fill="#263238"/>
    </g>

    <!-- 表情3：酷酷墨镜 (顶面) -->
    <g id="cool">
      <!-- 脸 -->
      <circle cx="0" cy="0" r="35" fill="#FFF9C4" stroke="#263238" stroke-width="5"/>
      <!-- 墨镜 -->
      <rect x="-22" y="-13" width="18" height="9" rx="2" fill="#263238"/>
      <rect x="4" y="-13" width="18" height="9" rx="2" fill="#263238"/>
      <line x1="-4" y1="-13" x2="-4" y2="-4" stroke="#263238" stroke-width="3"/>
      <!-- 嘴巴 -->
      <path d="M-15,14 Q0,20 15,14" fill="none" stroke="#263238" stroke-width="4" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- 正面表情：开心笑脸（较大） -->
  <use href="#happy" transform="translate(260 340)"/>

  <!-- 右侧面表情：惊讶（稍小） -->
  <g transform="translate(400 315) scale(0.85)">
    <use href="#surprise"/>
  </g>

  <!-- 顶面表情：酷酷（适合俯视角度） -->
  <g transform="translate(305 225) scale(0.78) rotate(-35 0 0)">
    <use href="#cool"/>
  </g>

  <!-- 额外冰块反光亮点 -->
  <circle cx="190" cy="270" r="8" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="410" cy="230" r="6" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="255" cy="205" r="7" fill="#FFFFFF" opacity="0.55"/>

</svg>