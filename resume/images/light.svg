<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="520" viewBox="0 0 500 520" fill="none">

  <!-- 背景 -->
  <rect width="500" height="520" fill="#F8F9FA"/>

  <!-- 灯泡发光光晕（柔和黄色） -->
  <ellipse cx="250" cy="220" rx="135" ry="165" fill="#FFF176" opacity="0.25"/>

  <!-- 灯泡玻璃主体（圆润形状） -->
  <!-- 主体填充 -->
  <path d="M250 80 
           Q150 90 140 190 
           Q140 280 190 340 
           Q250 380 310 340 
           Q360 280 360 190 
           Q350 90 250 80 Z" 
        fill="#FFFBCC" stroke="#263238" stroke-width="18"/>

  <!-- 内部高亮（发光效果） -->
  <path d="M250 90 
           Q170 105 165 195 
           Q170 270 215 325 
           Q250 355 285 325 
           Q330 270 335 195 
           Q330 105 250 90 Z" 
        fill="#FFEE8C" opacity="0.85"/>

  <!-- 灯丝（简单内芯） -->
  <!-- 左灯丝 -->
  <path d="M215 200 Q235 150 250 165" fill="none" stroke="#263238" stroke-width="5" stroke-linecap="round"/>
  <!-- 右灯丝 -->
  <path d="M285 200 Q265 150 250 165" fill="none" stroke="#263238" stroke-width="5" stroke-linecap="round"/>
  <!-- 底部连接 -->
  <line x1="245" y1="225" x2="255" y2="245" stroke="#263238" stroke-width="5" stroke-linecap="round"/>

  <!-- 灯泡螺口底座 -->
  <!-- 金属底座主体 -->
  <rect x="205" y="375" width="90" height="55" rx="8" fill="#5C6B7A" stroke="#263238" stroke-width="12"/>
  
  <!-- 螺纹细节 -->
  <rect x="210" y="385" width="80" height="8" fill="#8A9BAE"/>
  <rect x="210" y="400" width="80" height="8" fill="#8A9BAE"/>
  <rect x="210" y="415" width="80" height="8" fill="#8A9BAE"/>

  <!-- 底部接触点 -->
  <rect x="235" y="435" width="30" height="18" rx="3" fill="#263238"/>

  <!-- 灯泡高光（玻璃反光） -->
  <path d="M185 130 Q200 110 240 115" fill="none" stroke="#FFFFFF" stroke-width="18" opacity="0.45"/>

</svg>